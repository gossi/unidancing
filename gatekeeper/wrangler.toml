name = "unidancing"
main = "src/index.ts"
compatibility_date = "2025-02-02"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
vars = { ENVIRONMENT = "production", WORKER_ROOT = "https://connect.unidancing.art", APP_ROOT = "https://unidancing.art", FE_ORIGIN_ALLOWLIST = "https://unidancing.art" }

# [dev]
# port = 8787

[observability]
enabled = true
head_sampling_rate = 1

[env.staging]
workers_dev = true
vars = { ENVIRONMENT = "staging", WORKER_ROOT = "https://connect.unidancing.art", APP_ROOT = "https://unidancing.art", FE_ORIGIN_ALLOWLIST = "https://*.unidancing.pages.dev" }

[env.production]
vars = { ENVIRONMENT = "production", WORKER_ROOT = "https://connect.unidancing.art", APP_ROOT = "https://unidancing.art", FE_ORIGIN_ALLOWLIST = "https://unidancing.art" }
