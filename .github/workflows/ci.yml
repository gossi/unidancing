name: CI

on:
  pull_request:
  push:
    # filtering branches here prevents duplicate builds from pull_request and push
    branches:
      - main
      - 'v*'
    # always run CI for tags
    tags:
      - '*'

  # early issue detection: run CI weekly on Sundays
  # schedule:
  #   - cron: '0 6 * * 0'

env:
  CI: true

jobs:
  lint-js:
    name: Lint (JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint:js
        working-directory: web

  lint-types:
    name: Lint (Types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint:types
        working-directory: web

  lint-css:
    name: Lint (CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint:css
        working-directory: web

  playwright_version:
    name: playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          version=$(sed -nE "s/^[[:space:]]+[\"']?playwright[\"']?:[[:space:]]*[\"']?[\^~]?([0-9][0-9.a-z-]*)[\"']?[[:space:]]*$/\1/p" pnpm-workspace.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read playwright version from pnpm-workspace.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: playwright_version
    container:
      # Make sure to grab the latest version of the Playwright image
      # https://playwright.dev/docs/docker#pull-the-image
      image: mcr.microsoft.com/playwright:v${{ needs.playwright_version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup

      # - name: Lint JS
      #   run: pnpm run -r --parallel --aggregate-output lint:js
      # - name: Lint Types
      #   run: pnpm run -r --parallel --aggregate-output lint:types
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web

      - name: Tests
        run: pnpm run test
        working-directory: web
